    <circle cx="500" cy="310" r="7" fill="#009257" opacity="0.45"/><circle cx="500" cy="286" r="7" fill="#009257" opacity="0.45"/><circle cx="500" cy="262" r="7" fill="#009257" opacity="0.45"/><circle cx="500" cy="238" r="7" fill="#0095A4"/>
