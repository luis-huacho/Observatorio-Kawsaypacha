# Observatorio Kallpachakuy — orquestación de producción.
# Uso: docker compose up -d --build
# Dev:  docker compose -f compose.yml -f compose.dev.yml up --build
#
# Secretos: backend/.env (nunca se commitea; ver backend/.env.example).

services:
  db:
    image: postgres:16-alpine
    env_file: backend/.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: backend/.env
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
      meilisearch:
        condition: service_started
    restart: unless-stopped

  # Mismo código que backend; procesa la cola de django-tasks (correos,
  # importaciones de Excel, Gemini, generación de tiles).
  worker:
    build: ./backend
    env_file: backend/.env
    command: python manage.py db_worker
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:v1.15
    # Comparte backend/.env solo por MEILI_MASTER_KEY / MEILI_ENV.
    env_file: backend/.env
    volumes:
      - meili_data:/meili_data
    restart: unless-stopped

  # Compila la SPA y deja dist/ en el volumen que sirve Caddy; termina al copiar.
  frontend:
    build: ./frontend
    volumes:
      - web_dist:/out
    restart: "no"

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    env_file: backend/.env # SITE_DOMAIN, ADMIN_URL
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - web_dist:/srv/www:ro
      - media:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - meilisearch
    restart: unless-stopped

  # pg_dump diario con rotación (7 diarios / 4 semanales / 6 mensuales).
  backup:
    image: prodrigestivill/postgres-backup-local:16
    env_file: backend/.env
    environment:
      POSTGRES_HOST: db
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: "7"
      BACKUP_KEEP_WEEKS: "4"
      BACKUP_KEEP_MONTHS: "6"
      HEALTHCHECK_PORT: "8080"
    volumes:
      - backups:/backups
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  meili_data:
  media:
  web_dist:
  caddy_data:
  caddy_config:
  backups:
