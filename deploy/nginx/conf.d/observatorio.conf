# nginx del Observatorio Kallpachakuy (ADR-A6bis, ADR-A14).
#
# Dos dominios:
#   observatorio.predes.org.pe → la SPA compilada
#   obs.predes.org.pe          → API, admin, estáticos del admin, media, tiles y búsqueda
#
# Con SITE_DOMAIN=localhost (prueba del modo producción en local) los dos server_name caen en
# el bloque `default_server`, que es el primero: se atiende la SPA y el API queda en /api/ del
# mismo host. Es suficiente para verificar el build, no para producción.

# Los tiles se piden por rangos y son inmutables entre importaciones: merece la pena cachearlos
# en el propio nginx además de en el navegador.
proxy_cache_path /var/cache/nginx/tiles levels=1:2 keys_zone=tiles:10m max_size=512m inactive=7d;

upstream django {
    server backend:8000;
    keepalive 16;
}

# --- Redirección a HTTPS, dejando pasar el reto de certbot -------------------
server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- SPA pública ------------------------------------------------------------
server {
    listen 443 ssl default_server;
    http2 on;
    server_name observatorio.predes.org.pe;

    ssl_certificate     /etc/letsencrypt/live/observatorio.predes.org.pe/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/observatorio.predes.org.pe/privkey.pem;
    include /etc/nginx/conf.d/ssl-comun.inc;

    root /srv/www;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Los assets de Vite llevan hash en el nombre: se pueden cachear para siempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    # index.html NO se cachea: es lo que apunta a los assets nuevos tras un despliegue, y si el
    # navegador se queda con el viejo sigue pidiendo bundles que ya no existen.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    # Client-side routing: cualquier ruta desconocida la resuelve el router de React.
    location / {
        try_files $uri /index.html;
    }
}

# --- Backend ----------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name obs.predes.org.pe;

    ssl_certificate     /etc/letsencrypt/live/obs.predes.org.pe/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/obs.predes.org.pe/privkey.pem;
    include /etc/nginx/conf.d/ssl-comun.inc;

    # Los Excel del cliente rondan los 5.4 MB y los GeoJSON de capas llegan a 57 MB. Con el
    # límite por defecto (1 MB) la subida falla con un 413 que el editor no puede interpretar.
    client_max_body_size 80M;
    # Una importación de 10,978 filas o un teselado tardan más que el minuto por defecto.
    proxy_read_timeout 300s;

    location /api/ {
        include /etc/nginx/conf.d/proxy-comun.inc;
        proxy_pass http://django;
    }
    # Prefijo del admin: tiene que coincidir con ADMIN_URL de backend/.env.
    location /gestion/ {
        include /etc/nginx/conf.d/proxy-comun.inc;
        proxy_pass http://django;
    }
    location /static/ {
        alias /srv/static/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Búsqueda: proxy directo a Meilisearch. El navegador usa la llave search-only (ADR-A4).
    location /search/ {
        include /etc/nginx/conf.d/proxy-comun.inc;
        proxy_pass http://meilisearch:7700/;
    }

    location /media/ {
        alias /srv/media/;
        include /etc/nginx/conf.d/cors-publico.inc;
        expires 7d;
    }

    # Tiles PMTiles. Tres cosas imprescindibles:
    #   · Accept-Ranges: el protocolo pmtiles:// lee el archivo por rangos, no completo.
    #   · Expose-Headers con Content-Length y Content-Range: sin ellas, el JS cross-origin no
    #     puede leer la respuesta parcial y el visor se queda sin capas.
    #   · Cache-Control largo: los tiles solo cambian cuando se reimporta o se resube una capa.
    location /tiles/ {
        alias /srv/media/tiles/;
        include /etc/nginx/conf.d/cors-publico.inc;
        add_header Accept-Ranges bytes always;
        add_header Access-Control-Expose-Headers "Content-Length,Content-Range" always;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}
