# nginx del Observatorio Kallpachakuy (ADR-A6bis, ADR-A14).
#
# Dos dominios:
#   ${SITE_DOMAIN} → la SPA compilada
#   ${API_DOMAIN}  → API, admin, estáticos del admin, media, tiles y búsqueda
#
# Aquí NO hay ningún dominio escrito: los `server_name`, las rutas del certificado y el origen de
# CORS se generan al arrancar el contenedor. La imagen de nginx renderiza `deploy/nginx/templates/`
# con envsubst y deja el resultado en /etc/nginx/generado, que este archivo incluye. Las dos
# variables salen del .env de la RAÍZ (ver .env.example).
#
# Se generan **fragmentos incluidos** y no este archivo entero, a propósito: si el directorio de
# salida no fuera escribible, el script de la imagen escribe un ERROR en el log y **sigue
# adelante**. Generando el archivo completo, ese caso dejaría a nginx sirviendo su página de
# bienvenida —sin un solo bloque 443— con el contenedor aparentemente sano. Con fragmentos, el
# mismo fallo es un `include` a un archivo que no existe: nginx no arranca y dice por qué.
#
# Para probar el modo producción en local, sobre HTTP y en un solo host, está `compose.local.yml`,
# que sustituye esta configuración por la de `deploy/nginx/local/`.

# Los tiles se piden por rangos y son inmutables entre importaciones: merece la pena cachearlos
# en el propio nginx además de en el navegador.
proxy_cache_path /var/cache/nginx/tiles levels=1:2 keys_zone=tiles:10m max_size=512m inactive=7d;

# DNS embebido de Docker, con TTL corto. Es imprescindible: nginx resuelve los nombres del
# bloque `upstream` UNA SOLA VEZ, al cargar la configuración, y cachea la IP para siempre. Como
# cada `docker compose up -d backend` —es decir, cada despliegue— le da al contenedor una IP
# nueva, nginx se queda apuntando a la vieja y devuelve 502 hasta que alguien lo reinicia. Con el
# resolver y el destino en una variable, la resolución pasa a ser en cada petición.
#
# Coste asumido: con un destino variable se pierde el keepalive del bloque `upstream`. A este
# volumen de tráfico, sobrevivir a un despliegue vale mucho más que reutilizar conexiones.
resolver 127.0.0.11 valid=10s ipv6=off;

# El login del tracker (`/gitea`) queda expuesto a internet, así que se le pone techo a la fuerza
# bruta. 30 por minuto es holgado para una persona navegando y estrecho para un script. La zona se
# declara aunque el tracker no esté publicado: cuesta 10 MB de memoria compartida y evita que el
# día que se publique haya que acordarse de esto.
limit_req_zone $binary_remote_addr zone=gitea:10m rate=30r/m;

# --- Redirección a HTTPS, dejando pasar el reto de certbot -------------------
server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- SPA pública ------------------------------------------------------------
server {
    listen 443 ssl default_server;
    http2 on;
    include /etc/nginx/generado/dominio-spa.inc;
    include /etc/nginx/conf.d/ssl-comun.inc;

    root /srv/www;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Los assets de Vite llevan hash en el nombre: se pueden cachear para siempre.
    location /assets/ {
        include /etc/nginx/conf.d/seguridad-comun.inc;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    # index.html NO se cachea: es lo que apunta a los assets nuevos tras un despliegue, y si el
    # navegador se queda con el viejo sigue pidiendo bundles que ya no existen.
    location = /index.html {
        include /etc/nginx/conf.d/seguridad-comun.inc;
        add_header Cache-Control "no-cache";
    }
    # Client-side routing: cualquier ruta desconocida la resuelve el router de React.
    location / {
        try_files $uri /index.html;
    }
}

# --- Backend ----------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    include /etc/nginx/generado/dominio-api.inc;
    include /etc/nginx/conf.d/ssl-comun.inc;

    # Los Excel del cliente rondan los 5.4 MB y los GeoJSON de capas llegan a 57 MB. Con el
    # límite por defecto (1 MB) la subida falla con un 413 que el editor no puede interpretar.
    client_max_body_size 80M;
    # Una importación de 10,978 filas o un teselado tardan más que el minuto por defecto.
    proxy_read_timeout 300s;

    # `set` + variable en proxy_pass fuerza la resolución en cada petición (ver el resolver).
    location /api/ {
        include /etc/nginx/conf.d/proxy-comun.inc;
        set $destino_django backend:8000;
        proxy_pass http://$destino_django;
    }
    # Prefijo del admin: tiene que coincidir con ADMIN_URL de backend/.env.
    location /loginseguro/ {
        include /etc/nginx/conf.d/proxy-comun.inc;
        set $destino_django backend:8000;
        proxy_pass http://$destino_django;
    }
    location /static/ {
        include /etc/nginx/conf.d/seguridad-comun.inc;
        alias /srv/static/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Búsqueda: proxy directo a Meilisearch. El navegador usa la llave search-only (ADR-A4).
    location /search/ {
        include /etc/nginx/conf.d/proxy-comun.inc;
        set $destino_meili meilisearch:7700;
        # El prefijo se quita con `rewrite`, **no** con la barra final de proxy_pass: en cuanto
        # el destino lleva una variable, nginx deja de sustituir el prefijo de la location y la
        # barra pasa a ser el URI completo. Con `proxy_pass http://$destino_meili/`, todas las
        # peticiones llegaban a la raíz de Meilisearch: `/search/health` daba 200 —la raíz
        # responde 200— y `POST /search/multi-search` daba 405. El buscador caía al fallback de
        # DRF en cada búsqueda, sin un error a la vista.
        rewrite ^/search/(.*)$ /$1 break;
        proxy_pass http://$destino_meili;
    }

    location /media/ {
        include /etc/nginx/conf.d/seguridad-comun.inc;
        alias /srv/media/;
        include /etc/nginx/generado/cors-publico.inc;
        expires 7d;
    }

    # Tiles PMTiles. Tres cosas imprescindibles:
    #   · Accept-Ranges: el protocolo pmtiles:// lee el archivo por rangos, no completo.
    #   · Expose-Headers con Content-Length y Content-Range: sin ellas, el JS cross-origin no
    #     puede leer la respuesta parcial y el visor se queda sin capas.
    #   · Cache-Control largo: los tiles solo cambian cuando se reimporta o se resube una capa.
    location /tiles/ {
        include /etc/nginx/conf.d/seguridad-comun.inc;
        alias /srv/media/tiles/;
        include /etc/nginx/generado/cors-publico.inc;
        add_header Accept-Ranges bytes always;
        add_header Access-Control-Expose-Headers "Content-Length,Content-Range" always;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Tracker de errores (Gitea) como subruta. Solo responde si el tracker se levantó con
    # `compose.tracking-publicado.yml`, que es lo que lo engancha a esta red; si no está, esto da
    # 502 y **el resto del sitio sigue igual**, porque el destino va en una variable y se resuelve
    # en cada petición.
    #
    # El bloque sale de la documentación de Gitea para subrutas, que ella misma desaconseja («not
    # widely used and may have some issues in rare cases»). Se sigue tal cual en vez de escribir
    # una versión propia, precisamente porque es delicado:
    #
    #   · `rewrite ^ $request_uri` devuelve el URI SIN decodificar. Sin eso, nginx normaliza y los
    #     `%2F` de los nombres de rama y de fichero llegan rotos.
    #   · `rewrite ^/gitea/?(.*) /$1 break` quita el prefijo. No vale la barra final de proxy_pass:
    #     con una variable en el destino nginx deja de sustituir el prefijo de la location — el
    #     mismo motivo por el que /search/ necesita su rewrite.
    #   · El destino lleva `$uri` pegado por lo mismo.
    #
    # Y NO se incluye proxy-comun.inc: ese fija `Connection ""`, que impide el upgrade a websocket
    # que Gitea usa para refrescar su interfaz.
    location ~ ^/gitea($|/) {
        limit_req zone=gitea burst=10 nodelay;
        client_max_body_size 80M;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection $http_connection;
        proxy_set_header Upgrade $http_upgrade;

        # Para recortar la exposición sin renunciar al acceso web, descomentar y ajustar. Deja el
        # tracker accesible solo desde direcciones conocidas; el resto recibe 403 sin ver el login.
        #   allow 203.0.113.0/24;
        #   deny all;

        set $destino_gitea gitea:3000;
        rewrite ^ $request_uri;
        rewrite ^/gitea/?(.*) /$1 break;
        proxy_pass http://$destino_gitea$uri;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}
