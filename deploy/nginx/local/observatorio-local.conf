# nginx para probar el MODO PRODUCCIÓN EN LOCAL, sobre HTTP y en un solo host.
#
#   docker compose -f compose.yaml -f compose.local.yml up -d --build
#   → http://localhost/          la SPA compilada
#   → http://localhost/api/      el API
#   → http://localhost/gestion/  el admin
#
# No sustituye a la configuración de producción (`../conf.d/`): aquí no hay TLS, ni HSTS, ni dos
# dominios. Existe para verificar lo que el modo de desarrollo no cubre —que el build de Vite se
# sirve bien, que las rutas del router resuelven con try_files, que los estáticos del admin
# están donde nginx los busca y que los tiles se sirven por rangos— sin depender de tener DNS y
# certificados.

# DNS embebido de Docker, con TTL corto. Es imprescindible: nginx resuelve los nombres del
# bloque `upstream` UNA SOLA VEZ, al cargar la configuración, y cachea la IP para siempre. Como
# cada `docker compose up -d backend` —es decir, cada despliegue— le da al contenedor una IP
# nueva, nginx se queda apuntando a la vieja y devuelve 502 hasta que alguien lo reinicia. Con el
# resolver y el destino en una variable, la resolución pasa a ser en cada petición.
#
# Coste asumido: con un destino variable se pierde el keepalive del bloque `upstream`. A este
# volumen de tráfico, sobrevivir a un despliegue vale mucho más que reutilizar conexiones.
resolver 127.0.0.11 valid=10s ipv6=off;

# La misma zona de límite que en producción, para que `/gitea` se pueda probar entero aquí.
limit_req_zone $binary_remote_addr zone=gitea:10m rate=30r/m;

server {
    listen 80 default_server;
    server_name localhost;

    root /srv/www;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 80M;
    proxy_read_timeout 300s;

    # Destino en una variable para que se resuelva en cada petición (ver el resolver arriba).
    location /api/ {
        include /etc/nginx/comun/proxy-comun.inc;
        set $destino backend:8000;
        proxy_pass http://$destino;
    }
    location /gestion/ {
        include /etc/nginx/comun/proxy-comun.inc;
        set $destino backend:8000;
        proxy_pass http://$destino;
    }
    location /admin/ {
        include /etc/nginx/comun/proxy-comun.inc;
        set $destino backend:8000;
        proxy_pass http://$destino;
    }
    location /static/ { alias /srv/static/; }
    location /search/ {
        include /etc/nginx/comun/proxy-comun.inc;
        set $destino_meili meilisearch:7700;
        # `rewrite` y no la barra final de proxy_pass: con una variable en el destino, nginx no
        # sustituye el prefijo y todo acababa en la raíz de Meilisearch (ver observatorio.conf).
        rewrite ^/search/(.*)$ /$1 break;
        proxy_pass http://$destino_meili;
    }

    location /media/ {
        alias /srv/media/;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Las mismas tres cabeceras que en producción: sin Accept-Ranges y sin exponer
    # Content-Range, el protocolo pmtiles:// no puede leer el archivo por trozos.
    location /tiles/ {
        alias /srv/media/tiles/;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Expose-Headers "Content-Length,Content-Range" always;
        add_header Accept-Ranges bytes always;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Tracker de errores como subruta. Copia literal del bloque de producción —incluido el doble
    # rewrite de la documentación de Gitea— porque el objetivo de este archivo es poder comprobar
    # aquí lo que luego se despliega. Ver `../conf.d/observatorio.conf` para el porqué de cada línea.
    location ~ ^/gitea($|/) {
        limit_req zone=gitea burst=10 nodelay;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection $http_connection;
        proxy_set_header Upgrade $http_upgrade;

        set $destino_gitea gitea:3000;
        rewrite ^ $request_uri;
        rewrite ^/gitea/?(.*) /$1 break;
        proxy_pass http://$destino_gitea$uri;
    }

    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Link '</.well-known/api-catalog>; rel="api-catalog"';
    }
    # Las fichas y el sitemap salen de Django, igual que en producción: es el mismo index.html con
    # las metas Open Graph de cada ficha inyectadas (apps/sitio/vistas_html.py). Tiene que estar
    # aquí y no solo en conf.d/observatorio.conf, porque **este es el único modo local donde la
    # cadena entera —nginx, Django y el volumen del bundle— se prueba junta**.
    location ~ ^/(noticias|normativa|medidas|peligros)/[^/]+/?$ {
        include /etc/nginx/comun/proxy-comun.inc;
        set $destino backend:8000;
        proxy_pass http://$destino;
        proxy_intercept_errors on;
        error_page 400 500 502 503 504 = @spa;
    }
    # El sitemap se genera con el contenido publicado, así que también sale de Django.
    #
    # Y aquí NO se repliega a @spa, al revés que las fichas: una ficha replegada sigue siendo una
    # página que el visitante puede leer, pero un sitemap replegado es HTML servido con 200 a un
    # buscador que pidió XML — se ve como un sitemap roto en vez de como un servicio que no está.
    # Un 502 lo reintenta; un 200 mal formado, no.
    location = /sitemap.xml {
        include /etc/nginx/comun/proxy-comun.inc;
        set $destino backend:8000;
        proxy_pass http://$destino;
    }
    # Descubrimiento para agentes (ADR-A26). El repliegue de /robots.txt es el archivo estático y
    # no @spa: un 5xx ahí hace que Google DEJE de rastrear el sitio, así que el peor caso tiene que
    # ser un robots.txt sin la línea `Sitemap:`, nunca un HTML.
    location = /robots.txt {
        include /etc/nginx/comun/proxy-comun.inc;
        set $destino backend:8000;
        proxy_pass http://$destino;
        proxy_intercept_errors on;
        error_page 400 500 502 503 504 = @robots_estatico;
    }
    location @robots_estatico { try_files /robots.txt =404; }
    location = /.well-known/api-catalog {
        include /etc/nginx/comun/proxy-comun.inc;
        set $destino backend:8000;
        proxy_pass http://$destino;
    }
    # Sin esto, cualquier ruta bajo /.well-known/ cae en el `try_files` de abajo y responde 200 con
    # el index.html — un 200 a un documento que no existe. Aquí no hay certbot (perfil «nunca»).
    location /.well-known/ { return 404; }
    location @spa { try_files /index.html =404; }
    location / { try_files $uri /index.html; }
}
