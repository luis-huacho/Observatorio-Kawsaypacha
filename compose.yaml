# Observatorio Kallpachakuy — orquestación.
#
#   Producción:  docker compose up -d --build
#   Desarrollo:  docker compose -f compose.yaml -f compose.dev.yml up -d --build
#   Bajar todo:  docker compose -f compose.yaml -f compose.dev.yml down
#
# Secretos en backend/.env (nunca se commitea; ver backend/.env.example).
#
# Dos dominios (ADR-A14): SITE_DOMAIN sirve la SPA y API_DOMAIN el API, el admin, media y tiles.
# Los dos salen del .env de la RAÍZ (ver .env.example) y nginx los toma por envsubst, de modo que
# no hay ningún dominio escrito en el repositorio. nginx + certbot en contenedor (ADR-A6bis).

services:
  db:
    image: postgres:16-alpine
    env_file: backend/.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: backend/.env
    # Prueba de vida, no de dependencias: `/api/salud/` responde 200 aunque la base o el buscador
    # estén caídos (ver apps/api/views/salud.py). Si fallara por ellos, una caída de PostgreSQL
    # marcaría esto «unhealthy» y `deploy/vigilar-contenedores.sh` reiniciaría en bucle sin
    # arreglar nada. Va contra localhost, así que **ALLOWED_HOSTS tiene que incluir localhost**.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8000/api/salud/"]
      interval: 10s
      timeout: 5s
      retries: 5
      # `docker-entrypoint.sh` corre migrate y meili_setup ANTES de gunicorn. Sin margen, el
      # contenedor nacería «unhealthy» en cada despliegue y el vigilante lo reiniciaría a media
      # migración.
      start_period: 90s
    volumes:
      - media:/app/media
      - static:/app/staticfiles
      # Registros .txt de cada intercambio con la IA (entrada y salida). Va al MISMO
      # directorio en el que ya escriben `desplegar.sh` y `vigilar-contenedores.sh`, que es
      # donde mira quien opera. **Nunca se monta en nginx**: eso es lo que impide que
      # estos archivos acaben siendo descargables, como sí lo sería todo lo de /media/.
      - ${OBSERVATORIO_REGISTROS:-./logs}:/app/logs
      # Los Excel y GeoJSON canónicos, de solo lectura: `manage.py seed` los importa desde aquí.
      - ./data/layers:/datos:ro
      # Los CSV del PP 0068. Montaje aparte y no dentro de `/datos` porque anidar un montaje
      # dentro de otro de solo lectura falla; `seed` no los toca —la inversión entra por
      # `DatasetUpload`, ver el runbook de `_docs/despliegue.md`—.
      - ./data/inversion:/datos-inversion:ro
    depends_on:
      db:
        condition: service_healthy
      meilisearch:
        condition: service_started
    restart: unless-stopped

  # Mismo código e imagen que backend; procesa la cola de django-tasks (importaciones de Excel,
  # tiles, resúmenes con Gemini, correos, agregación de métricas).
  worker:
    build: ./backend
    env_file: backend/.env
    command: python manage.py db_worker
    volumes:
      - media:/app/media
      # Registros .txt de cada intercambio con la IA (entrada y salida). Va al MISMO
      # directorio en el que ya escriben `desplegar.sh` y `vigilar-contenedores.sh`, que es
      # donde mira quien opera. **Nunca se monta en nginx**: eso es lo que impide que
      # estos archivos acaben siendo descargables, como sí lo sería todo lo de /media/.
      - ${OBSERVATORIO_REGISTROS:-./logs}:/app/logs
      - ./data/layers:/datos:ro
      - ./data/inversion:/datos-inversion:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:v1.15
    # Comparte backend/.env solo por MEILI_MASTER_KEY y MEILI_ENV.
    env_file: backend/.env
    volumes:
      - meili_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Compila la SPA y deja dist/ en el volumen que sirve nginx; termina al copiar.
  # Las VITE_* van como build args porque Vite las hornea en el bundle: si no llegan al build,
  # la imagen sale apuntando a localhost. Salen del .env de la RAÍZ (ver .env.example), que es
  # el que interpola compose — distinto de backend/.env, que son los secretos de Django.
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:?falta VITE_API_URL en el .env de la raíz}
        VITE_SEARCH_URL: ${VITE_SEARCH_URL:-}
        VITE_TILES_URL: ${VITE_TILES_URL:-}
        VITE_MEILI_SEARCH_KEY: ${VITE_MEILI_SEARCH_KEY:-}
        VITE_CARTO_KEY: ${VITE_CARTO_KEY:-}
    volumes:
      - web_dist:/out
    restart: "no"

  # Los dominios NO están escritos en la configuración: `server_name`, las rutas del certificado y
  # el origen de CORS se generan al arrancar con envsubst —el mecanismo nativo de la imagen, que
  # renderiza /etc/nginx/templates en NGINX_ENVSUBST_OUTPUT_DIR— a partir de SITE_DOMAIN y
  # API_DOMAIN. Así el mismo árbol sirve para el entorno de desarrollo y para producción.
  nginx:
    image: nginx:1.27-alpine
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?falta SITE_DOMAIN en el .env de la raíz}
      API_DOMAIN: ${API_DOMAIN:?falta API_DOMAIN en el .env de la raíz}
      # Se genera FUERA de conf.d a propósito: ver la cabecera de observatorio.conf.
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx/generado
      # Acota envsubst a estas dos variables, para que no pueda tocar $$host, $$uri o
      # $$destino_django si algún día este servicio hereda un env_file. `$$` es el escape de
      # compose para un `$` literal.
      NGINX_ENVSUBST_FILTER: "^(SITE_DOMAIN|API_DOMAIN)$$"
    # El directorio de salida tiene que existir Y ser escribible ANTES de que corra
    # /docker-entrypoint.d/20-envsubst-on-templates.sh, que comprueba `-w` antes de crear nada.
    tmpfs:
      - /etc/nginx/generado
    # El :80 responde 301 a cualquier host, y `curl -f` da por bueno un 3xx: prueba de vida sin
    # depender de certificados ni de SNI. Basta con que el maestro esté atendiendo.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./deploy/nginx/templates:/etc/nginx/templates:ro
      # Añade la recarga periódica que toma el certificado renovado (40-recarga-periodica.sh).
      - ./deploy/nginx/docker-entrypoint.d:/docker-entrypoint.d/observatorio:ro
      - web_dist:/srv/www:ro
      - media:/srv/media:ro
      - static:/srv/static:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - backend
      - meilisearch
    restart: unless-stopped

  # Renovación de certificados por webroot. `renew` no hace nada si aún no toca, así que el bucle
  # es seguro. Quien recoge el certificado renovado es el propio nginx, que se recarga cada 6 h
  # desde deploy/nginx/docker-entrypoint.d/40-recarga-periodica.sh.
  #
  # La PRIMERA emisión no la hace este servicio: nginx no arranca sin los .pem, así que no puede
  # servir el reto de /.well-known/ antes de que exista el primer certificado. Se rompe el círculo
  # con `certonly --standalone` y nginx parado — ver el paso 2 de _docs/despliegue.md.
  certbot:
    image: certbot/certbot
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: >-
      sh -c 'trap exit TERM;
      while :; do certbot renew --webroot -w /var/www/certbot --quiet;
      sleep 12h & wait $${!}; done'
    restart: unless-stopped

  # pg_dump diario con rotación (7 diarios / 4 semanales / 6 mensuales).
  backup:
    image: prodrigestivill/postgres-backup-local:16
    env_file: backend/.env
    environment:
      POSTGRES_HOST: db
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: "7"
      BACKUP_KEEP_WEEKS: "4"
      BACKUP_KEEP_MONTHS: "6"
      HEALTHCHECK_PORT: "8080"
    volumes:
      - backups:/backups
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  meili_data:
  # media incluye tiles/, datasets/, informes/ y contenido/ — todo lo que sube PREDES.
  media:
  static:
  web_dist:
  certbot_conf:
  certbot_www:
  backups:
