# Override de desarrollo.
#
#   Arriba:  docker compose -f compose.yaml -f compose.dev.yml up -d --build
#   Abajo:   docker compose -f compose.yaml -f compose.dev.yml down
#   Logs:    docker compose -f compose.yaml -f compose.dev.yml logs -f backend worker
#
# Qué cambia respecto de producción:
# - Publica db (5432), meilisearch (7700) y backend (8000) en el host, para poder atacarlos
#   desde herramientas locales y desde el Vite dev server.
# - `runserver` con el código montado, para recarga en caliente.
# - nginx, certbot, backup y frontend quedan fuera (perfil "prod"): el frontend en dev corre en
#   el host con `npm run dev`, que da recarga instantánea y mapas de fuentes.
#
# Este es el modo del día a día: el código va montado, así que **`--build` solo hace falta cuando
# cambian las dependencias** (pyproject.toml / uv.lock), no al editar código.
#
# Para probar el modo producción en local —SPA compilada servida por nginx en el :80— está el
# tercer override, compose.local.yml:
#
#   docker compose -f compose.yaml -f compose.dev.yml down          # ver el aviso de abajo
#   docker compose -f compose.yaml -f compose.local.yml up -d --build
#   docker compose -f compose.yaml -f compose.local.yml run --rm frontend
#   docker compose -f compose.yaml -f compose.local.yml exec backend python manage.py collectstatic --noinput
#
# Los dos modos comparten nombre de proyecto, así que **hay que bajar uno antes de levantar el
# otro**: al pasar a dev, nginx no se detiene solo —su perfil "prod" solo impide arrancarlo— y se
# queda sirviendo en el :80 el bundle viejo del volumen web_dist contra el backend nuevo.

services:
  db:
    ports:
      - "5432:5432"

  meilisearch:
    ports:
      - "7700:7700"

  backend:
    # Con las dependencias de desarrollo, para que `pytest` corra dentro del contenedor y la
    # suite use las mismas versiones de GDAL, tippecanoe y WeasyPrint que producción.
    #
    # `image` con nombre propio para que las dos imágenes convivan: sin él, un
    # `up --build` del modo producción local reconstruye SIN el grupo dev sobre el mismo tag y
    # `pytest` desaparece del contenedor de desarrollo con un «executable file not found».
    image: predes-observatorio-backend-dev
    build:
      context: ./backend
      args:
        GRUPOS_UV: "--group dev"
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      DEBUG: "True"
      # Sin SMTP configurado los correos del flujo editorial van a la consola del contenedor.
      EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
      # Sin throttling en desarrollo. Vacío = sin límite; en producción no se define nada y
      # rigen los defectos de settings.py (1000/hora, 30/hora, 600/min).
      #
      # La suite E2E no cabe en la cuota anónima: 112 corridas con caché de navegador fría, a 8
      # peticiones por portada, son ~1.100 contra un techo de 1.000. A mitad de suite todo pasaba
      # a responder 429, y eso en una prueba **no se lee como un límite sino como un sitio caído**.
      API_THROTTLE_ANON: ""
      # También la de descargas, y es la más justa de las tres: `inversion.spec.ts` pide el PDF
      # en los dos proyectos contra un techo de 30/hora.
      API_THROTTLE_DESCARGA: ""
      API_THROTTLE_BEACON: ""
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      # El venv de la imagen no se pisa con el del host: son plataformas distintas y el del
      # host puede no existir.
      - /app/.venv
      - media:/app/media
      - ./data/layers:/datos:ro
      - ./data/inversion:/datos-inversion:ro

  worker:
    # La misma imagen que el backend: es el mismo código, y tenerlas distintas haría que una
    # tarea se comporte de otra forma que la vista que la encoló.
    image: predes-observatorio-backend-dev
    build:
      context: ./backend
      args:
        GRUPOS_UV: "--group dev"
    environment:
      DEBUG: "True"
      EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
    volumes:
      - ./backend:/app
      - /app/.venv
      - media:/app/media
      - ./data/layers:/datos:ro
      - ./data/inversion:/datos-inversion:ro

  frontend:
    profiles: ["prod"]

  nginx:
    profiles: ["prod"]

  certbot:
    profiles: ["prod"]

  backup:
    profiles: ["prod"]
