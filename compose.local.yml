# Override para probar el MODO PRODUCCIÓN EN LOCAL, sobre HTTP y en un solo host.
#
#   docker compose -f compose.yaml -f compose.local.yml up -d --build
#   docker compose -f compose.yaml -f compose.local.yml down
#
# Qué verifica que el modo de desarrollo NO cubre: que el bundle de Vite se sirve bien, que las
# rutas del router resuelven por try_files, que los estáticos del admin están donde nginx los
# busca, y que los tiles salen por rangos con sus cabeceras CORS.
#
# Antes de levantarlo hace falta un .env en la raíz con las VITE_* apuntando a http://localhost
# (ver .env.example). `SITE_DOMAIN` y `API_DOMAIN` también tienen que estar —compose las exige con
# `:?` en el servicio nginx— aunque aquí no se usen: la configuración local no tiene dominios ni
# TLS. Los fragmentos que genera envsubst van a un tmpfs que esta configuración no incluye.

services:
  # `BACKEND_URL` es la URL con la que **el navegador** alcanza al backend: el API la usa para
  # construir las URL absolutas de `/tiles/` y `/media/` que devuelve a la SPA. En este modo el
  # backend no publica el 8000, así que apuntarlo ahí deja al visor pidiendo tiles a un puerto
  # cerrado (ERR_CONNECTION_REFUSED) mientras todo lo demás funciona.
  #
  # `DEBUG` se fija aquí en vez de dejarlo al valor de backend/.env, por simetría con
  # compose.dev.yml —que fuerza DEBUG=True— y porque si no, el modo que existe para simular
  # producción hereda lo que haya quedado en el .env: con DEBUG=True un 404 sale con la traza de
  # Django en vez de la página real, que es justo lo que este modo tendría que estar comprobando.
  # Requiere que ALLOWED_HOSTS incluya el host usado (`localhost`); ya lo hace.
  backend:
    environment:
      DEBUG: "False"
      BACKEND_URL: http://localhost
      SITE_URL: http://localhost
      CORS_ALLOWED_ORIGINS: http://localhost
      RENDER_MAPA_BASE_URL: http://backend:8000

  worker:
    environment:
      DEBUG: "False"
      BACKEND_URL: http://localhost
      RENDER_MAPA_BASE_URL: http://backend:8000

  nginx:
    # Solo la config local: la de producción exige certificados que aquí no existen.
    volumes:
      # `conf.d` se REEMPLAZA por el directorio local (mismo target que en compose.yaml, así
      # que compose sustituye en vez de acumular). Los includes compartidos van a otra ruta:
      # anidar un montaje dentro de conf.d falla, porque el de producción va en solo lectura.
      - ./deploy/nginx/local:/etc/nginx/conf.d:ro
      - ./deploy/nginx/conf.d:/etc/nginx/comun:ro
      - web_dist:/srv/www:ro
      - media:/srv/media:ro
      - static:/srv/static:ro
    ports:
      - "80:80"

  # certbot no tiene sentido sin dominio público.
  certbot:
    profiles: ["nunca"]

  backup:
    profiles: ["nunca"]
