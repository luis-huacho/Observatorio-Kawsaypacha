{# Botón como tabla y no como <a> con padding: Outlook ignora el padding de los enlaces. #}
<table role="presentation" cellpadding="0" cellspacing="0" style="margin:18px 0">
  <tr><td style="background:#14654A;border-radius:6px">
    <a href="{{ url }}" style="display:inline-block;padding:10px 18px;color:#FFFFFF;
       text-decoration:none;font-weight:600;font-size:14px">{{ texto }}</a>
  </td></tr>
</table>
