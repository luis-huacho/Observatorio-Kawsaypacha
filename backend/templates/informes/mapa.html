<!--
  Visor mínimo para la captura del mapa de la ayuda memoria.

  No es el visor de la SPA: es una página de un solo uso que dibuja lo justo que va al PDF
  —centros poblados por nivel y las capas de contexto— y avisa cuando terminó de pintar. Se
  mantiene aparte a propósito: reutilizar el componente de React obligaría a levantar un build
  del frontend dentro del worker.

  Semáforo, radios por población y `coalesce(nivel, 0)` son los mismos que el visor (spec 05),
  para que el mapa del documento se lea igual que el de la pantalla.
-->
{% load static %}<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; }
  #mapa { width: {{ ancho }}px; height: {{ alto }}px; }
  .maplibregl-ctrl-attrib { font-size: 9px; }
</style>
<div id="mapa"></div>

<!-- MapLibre y pmtiles van servidos por el propio backend, no desde un CDN: el worker que
     genera el PDF puede estar en un servidor sin salida a internet, y una dependencia externa
     ahí falla en silencio justo cuando alguien necesita el documento. -->
<script src="{% static 'vendor/maplibre-gl.js' %}"></script>
<link href="{% static 'vendor/maplibre-gl.css' %}" rel="stylesheet">
<script src="{% static 'vendor/pmtiles.js' %}"></script>

<script>
  const COLOR = { 1: "#5BBB5D", 2: "#EBB320", 3: "#F57C15", 4: "#970A00", 0: "#9CA3AF" };

  // Radio por clases graduadas y no lineal: la población de los CCPP va de 0 a 111,930 y una
  // escala lineal deja el 90% de los puntos indistinguibles (spec 05).
  const RADIO = [
    "step", ["coalesce", ["get", "poblacion"], 0],
    2.5, 1, 4, 50, 6, 200, 8.5, 1000, 12, 10000, 17,
  ];

  maplibregl.addProtocol("pmtiles", new pmtiles.Protocol().tile);

  (async () => {
    let puntos = { type: "FeatureCollection", features: [] };
    let capas = [];
    try {
      [puntos, capas] = await Promise.all([
        fetch("{{ url_geojson }}").then((r) => r.json()),
        fetch("{{ url_capas }}").then((r) => r.json()),
      ]);
    } catch (e) {
      // Sin datos no hay mapa útil. Se señaliza el FALLO, no "listo": marcar listo haría que
      // un mapa en blanco pasara por bueno, que es peor que no tener mapa.
      window.__mapaError = "no se pudieron cargar los datos: " + e;
      return;
    }

    const mapa = new maplibregl.Map({
      container: "mapa",
      style: {
        version: 8,
        sources: {
          osm: {
            type: "raster",
            tiles: ["https://tile.openstreetmap.org/{z}/{x}/{y}.png"],
            tileSize: 256, maxzoom: 19,
            attribution: "© OpenStreetMap",
          },
        },
        layers: [{ id: "osm", type: "raster", source: "osm" }],
      },
      attributionControl: { compact: false },
      interactive: false,
      // Sin `preserveDrawingBuffer` el canvas WebGL se lee en blanco: el navegador puede
      // descartar el búfer en cuanto termina de pintar, y la captura llega después. Es la
      // misma trampa que documenta el spec 05 para la exportación a PNG del visor.
      preserveDrawingBuffer: true,
    });

    mapa.on("load", () => {
      for (const capa of capas) {
        mapa.addSource(capa.slug, { type: "vector", url: "pmtiles://" + capa.url });
        const e = capa.estilo || {};
        if (capa.tipo_geometria === "linea") {
          mapa.addLayer({
            id: capa.slug, type: "line", source: capa.slug, "source-layer": capa.slug,
            paint: {
              "line-color": e["line-color"] || "#0095A4",
              "line-width": e["line-width"] || 0.8,
              "line-opacity": e["line-opacity"] ?? 0.75,
            },
          });
        } else {
          mapa.addLayer({
            id: capa.slug, type: "fill", source: capa.slug, "source-layer": capa.slug,
            paint: {
              "fill-color": e["fill-color"] || "#0095A4",
              "fill-opacity": e["fill-opacity"] ?? 0.35,
              "fill-outline-color": e["line-color"] || "#007480",
            },
          });
        }
      }

      mapa.addSource("ccpp", { type: "geojson", data: puntos });
      mapa.addLayer({
        id: "ccpp", type: "circle", source: "ccpp",
        paint: {
          "circle-radius": RADIO,
          // `coalesce(…, 0)` mantiene "sin dato" como categoría propia y en gris, no como
          // nivel bajo en verde.
          "circle-color": [
            "match", ["coalesce", ["get", "nivel"], 0],
            1, COLOR[1], 2, COLOR[2], 3, COLOR[3], 4, COLOR[4], COLOR[0],
          ],
          "circle-stroke-width": 0.6,
          "circle-stroke-color": "#FFFFFF",
          "circle-opacity": 0.9,
          "circle-stroke-opacity": 0.9,
        },
      });

      if (puntos.features.length) {
        const b = new maplibregl.LngLatBounds();
        for (const f of puntos.features) b.extend(f.geometry.coordinates);
        mapa.fitBounds(b, { padding: 40, animate: false, maxZoom: 13 });
      }

      // `idle` y no `load`: se emite cuando no queda nada pendiente por cargar ni dibujar, que
      // es la única señal fiable de que la captura no va a salir a medias (spec 05).
      mapa.once("idle", () => { window.__mapaListo = true; });
    });

    // El error se señaliza como error. La primera versión de esto ponía `__mapaListo = true`
    // en el manejador, y el resultado fue una captura en blanco que el PDF incrustaba como si
    // fuera un mapa: el fallo se veía como éxito.
    mapa.on("error", (e) => {
      window.__mapaError = String((e && e.error && e.error.message) || e);
    });
  })();
</script>
