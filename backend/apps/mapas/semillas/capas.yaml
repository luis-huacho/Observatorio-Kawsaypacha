# Capas de contexto del visor. Los estilos son los ya validados en el prototipo; viven en la
# base (y no en el código del frontend) porque el TDR exige que PREDES pueda reemplazar capas y
# cambiar su apariencia sin asistencia técnica.
#
# `archivo_geojson` queda vacío a propósito: los archivos fuente son 140 MB que no se versionan.
# `manage.py seed --capas` los adjunta desde DATOS_FUENTE_DIR y encola la generación de tiles.

capas:
  - slug: rios
    nombre: Ríos
    descripcion: >-
      Red hidrográfica nacional recortada a Cusco (3,164 de 33,950 cauces).
    tipo_geometria: linea
    # El campo del departamento en esta fuente es DN99.
    filtro_atributo: DN99=CUSCO
    min_zoom: 0
    max_zoom: 12
    visible_por_defecto: true
    orden: 2
    fuente: ANA - Red hidrográfica del Perú
    atribucion: ANA - Red hidrográfica del Perú
    estilo:
      tipo: line
      line-color: "#0095A4"
      # Los cauces menores se afinan al alejarse para no emborronar la región.
      line-width: ["interpolate", ["linear"], ["zoom"], 6, 0.4, 12, 1.6]
      line-opacity: 0.75

  - slug: lagunas
    nombre: Lagunas
    descripcion: >-
      Lagos y lagunas del inventario nacional recortados a Cusco (2,512 de 27,464).
    tipo_geometria: poligono
    # ILIKE y no `=`: la fuente escribe "Cusco" en 2,439 registros y "CUSCO" en 73, y una
    # comparación sensible a mayúsculas pierde esos 73 polígonos.
    filtro_atributo: DPTO ILIKE cusco
    min_zoom: 0
    max_zoom: 12
    visible_por_defecto: true
    orden: 3
    fuente: ANA - Inventario nacional de lagunas
    atribucion: ANA - Inventario nacional de lagunas
    estilo:
      tipo: fill
      fill-color: "#0095A4"
      fill-opacity: 0.35
      line-color: "#007480"
      line-width: 0.6

  - slug: glaciares
    nombre: Glaciares
    descripcion: >-
      Inventario nacional de glaciares; ~1,155 de 3,067 en las cordilleras de Cusco
      (Vilcanota, Vilcabamba, Urubamba, La Raya y parte de Carabaya).
    tipo_geometria: poligono
    # Sin campo de departamento: se recorta espacialmente con el polígono regional. El archivo
    # viene en EPSG:32718, así que la reproyección del pipeline es imprescindible.
    filtro_atributo: ""
    min_zoom: 0
    max_zoom: 12
    visible_por_defecto: true
    orden: 4
    fuente: INAIGEM - Inventario nacional de glaciares
    atribucion: INAIGEM - Inventario nacional de glaciares
    estilo:
      tipo: fill
      fill-color: "#CCEAED"
      fill-opacity: 0.8
      line-color: "#007480"
      line-width: 0.5

  # --- Límites administrativos --------------------------------------------------
  # Son de otra naturaleza que las tres de arriba: no son elementos del territorio sino
  # divisiones políticas, así que van con `orden` bajo (se dibujan primero, por debajo) y con
  # estilo de SOLO CONTORNO — un relleno taparía ríos, lagunas y los propios centros poblados.
  #
  # Fuente: github.com/josedaniel-cb/limites-peru-geojson (MIT). Trae `UBIGEO` por distrito, que
  # es lo que permite casarlos con el padrón: los 112 de Cusco y las 13 provincias corresponden
  # exactamente. **Los archivos se descargan una vez y se sirven como PMTiles desde este mismo
  # servidor**: el visitante nunca sale al repositorio de origen.
  - slug: limites-provinciales
    nombre: Límites provinciales
    descripcion: >-
      Las 13 provincias de Cusco. Da contexto sin cargar el mapa: a escala regional los
      distritos son una malla demasiado densa.
    tipo_geometria: poligono
    # El departamento es CCDD en esta fuente; 08 es Cusco.
    filtro_atributo: CCDD=08
    min_zoom: 0
    max_zoom: 12
    visible_por_defecto: true
    orden: 0
    fuente: INEI - Límites provinciales (via josedaniel-cb/limites-peru-geojson, MIT)
    atribucion: INEI - Límites provinciales
    estilo:
      tipo: fill
      # Sin relleno: el límite es la línea, y un fill aquí escondería todo lo que hay debajo.
      fill-color: "#0B3B26"
      fill-opacity: 0
      line-color: "#0B3B26"
      line-width: ["interpolate", ["linear"], ["zoom"], 6, 0.8, 12, 2]
      line-opacity: 0.55

  - slug: limites-distritales
    nombre: Límites distritales
    descripcion: >-
      Los 112 distritos de Cusco. Apagada por defecto: superpuesta a los símbolos de peligro a
      escala regional compite con ellos.
    tipo_geometria: poligono
    filtro_atributo: CCDD=08
    min_zoom: 0
    max_zoom: 12
    visible_por_defecto: false
    orden: 1
    fuente: INEI - Límites distritales (via josedaniel-cb/limites-peru-geojson, MIT)
    atribucion: INEI - Límites distritales
    estilo:
      tipo: fill
      fill-color: "#0B3B26"
      fill-opacity: 0
      # Más fina que la provincial y punteada por opacidad: superpuestas, hay que poder
      # distinguir cuál es cuál de un vistazo.
      line-color: "#555555"
      line-width: ["interpolate", ["linear"], ["zoom"], 6, 0.3, 12, 0.9]
      line-opacity: 0.45
