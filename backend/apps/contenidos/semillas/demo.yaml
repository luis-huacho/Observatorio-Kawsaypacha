  destacada: false
- slug: lectura-directiva-ppr-0068-2025
  titulo: La directiva del PPR 0068 cambia el peso entre prevención y respuesta
  bajada: 'Lectura del instrumento desde la experiencia en comunidades altoandinas: qué habilita,
    qué deja fuera y cómo aprovecharlo en la formulación distrital.'
  cuerpo: |-
    <p>Los lineamientos del Programa Presupuestal 0068 para el ejercicio fiscal ajustan la relación entre las actividades de prevención y las de atención de emergencias. El cambio abre espacio para financiar intervenciones estructurales, pero exige sustentar la priorización con información de exposición.</p>
    <p>En la práctica, eso significa que un distrito necesita poder demostrar dónde están sus centros poblados más expuestos y con qué respaldo documental. Es exactamente el tipo de sustento que el observatorio busca poner al alcance de los equipos municipales.</p>
    <p>La lectura completa del instrumento, junto con el análisis de PREDES, está disponible en la sección de Normativa.</p>
  tipo: opinion
  autor: Área de incidencia — PREDES
  fecha: '2026-03-03'
  imagen_titulo: ''
  palabras_clave:
  - PPR 0068
  - MEF
  - prevención
  - presupuesto
  destacada: false
- slug: capas-glaciares-rios-lagunas
  titulo: El visor incorpora las capas de glaciares, ríos y lagunas de Cusco
  bajada: 'Las tres capas cartográficas nacionales fueron recortadas a la región: 3,164 tramos de
    río, 2,512 lagunas y 1,155 glaciares.'
  cuerpo: |-
    <p>El visor de exposición suma tres capas de contexto territorial que pueden activarse y desactivarse sobre el mapa: la red hidrográfica, los cuerpos de agua y los glaciares de la región.</p>
    <p>Las capas provienen de fuentes nacionales y fueron recortadas al ámbito de Cusco para que el visor cargue con agilidad. El mapa también permite alternar entre cuatro fondos, incluido uno topográfico con relieve, especialmente útil para leer quebradas y pendientes al analizar movimientos en masa y huaicos.</p>
    <p>Las capas oficiales del especialista SIG de la región reemplazarán a las actuales cuando estén disponibles.</p>
  tipo: noticia
  autor: Equipo del Observatorio Kallpachakuy
  fecha: '2026-02-17'
  imagen_titulo: ''
  palabras_clave:
  - cartografía
