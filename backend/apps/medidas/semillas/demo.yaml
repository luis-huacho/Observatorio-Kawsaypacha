- slug: forestacion-anta
  titulo: Forestación con especies nativas en cabeceras — Anta
  peligro: sequia
  ambito: distrital
  resultado: exito
  distrito: 080501
  comunidad: Anta
  resumen_corto: Plantación de 50 ha con queuña y q'olle para recuperar regulación hídrica en cabeceras
    de cuenca.
  contenido: |-
    <p>Programa multianual de plantación con especies nativas en cabeceras de cuenca, con apoyo de INAIGEM y participación de seis comunidades campesinas.</p>
    <h2>Especies y superficie</h2>
    <p>Se plantaron <strong>50 hectáreas</strong> con queuña (<em>Polylepis</em>) y q'olle, elegidas por su capacidad de retención de humedad y su adaptación a la altitud de la zona.</p>
    <h2>Por qué en cabecera</h2>
    <p>La cobertura vegetal en cabecera regula la infiltración y retrasa la escorrentía, lo que sostiene el caudal de los manantes en la época seca. Es una intervención cuyo efecto se mide en años, no en campañas.</p>
    <ul>
    <li>Vivero comunal para producción de plantones.</li>
    <li>Cercado temporal para proteger del pastoreo.</li>
    <li>Monitoreo de prendimiento a los 6, 12 y 24 meses.</li>
    </ul>
