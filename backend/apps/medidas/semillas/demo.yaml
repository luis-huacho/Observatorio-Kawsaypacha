- slug: mal-adaptacion-reservorio-paucartambo
  titulo: 'Reservorio sin operación: caso de mal-adaptación en Paucartambo'
  peligro: sequia
  ambito: distrital
  resultado: mal_adaptacion
  distrito: 080701
  comunidad: Paucartambo
  resumen_corto: 'Obra ejecutada en 2021 sin canal de derivación ni capacitación a usuarios. Resultado:
    infraestructura no operativa.'
  contenido: |-
    <p>Obra ejecutada en 2021 sin canal de derivación ni capacitación a usuarios. El resultado es una <strong>infraestructura no operativa</strong> documentada por PREDES como caso de mala adaptación.</p>
    <h2>Qué salió mal</h2>
    <ol>
    <li>El expediente técnico no incluyó el canal que conecta el reservorio con las parcelas.</li>
    <li>No se conformó ni capacitó la organización de usuarios de agua.</li>
    <li>No se previó presupuesto de operación y mantenimiento.</li>
    </ol>
    <blockquote><p>Se inauguró el reservorio, pero el agua nunca llegó a la chacra.</p></blockquote>
    <h2>La lección</h2>
    <p>La inversión en infraestructura <strong>debe acompañarse de organización social, capacitación y mantenimiento</strong>. Sin esos tres componentes, la obra cuenta como ejecución presupuestal pero no como reducción de riesgo — y ocupa el lugar de una intervención que sí lo habría sido.</p>
  video_url: null
  imagen_titulo: ''
