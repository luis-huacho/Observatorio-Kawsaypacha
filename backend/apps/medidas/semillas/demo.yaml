medidas:
- slug: qochas-pampallacta
  titulo: Qochas comunales en Pampallacta
  peligro: sequia
  ambito: comunal
  resultado: exito
  distrito: 080302
  comunidad: Pampallacta
  resumen_corto: Construcción de 12 qochas que abastecen riego en época seca y han recargado bofedales
    aledaños.
  contenido: |-
    <p>La comunidad de Pampallacta, en alianza con la municipalidad de Pisac y PREDES, implementó un sistema de <strong>12 qochas</strong> que captan las lluvias estacionales y recargan los bofedales aguas abajo.</p>
    <h2>Cómo se hizo</h2>
    <p>El trabajo se organizó por faenas comunales durante dos temporadas de lluvia, combinando conocimiento local sobre dónde retiene el agua el terreno con el levantamiento topográfico del equipo técnico.</p>
    <ul>
    <li>Identificación participativa de los puntos de captación.</li>
    <li>Excavación y compactación manual de los vasos.</li>
    <li>Siembra de pasto nativo en los bordes para evitar erosión.</li>
    <li>Acuerdo comunal de mantenimiento anual antes de la temporada de lluvias.</li>
    </ul>
    <h2>Resultados medidos</h2>
    <figure class="table"><table><thead><tr><th>Indicador</th><th>Antes</th><th>Después</th></tr></thead><tbody>
    <tr><td>Meses con agua para riego</td><td>5</td><td>7</td></tr>
    <tr><td>Qochas operativas</td><td>0</td><td>12</td></tr>
    <tr><td>Familias con riego en estiaje</td><td>18</td><td>63</td></tr>
    </tbody></table></figure>
    <blockquote><p>Antes bajábamos al río dos horas para regar. Ahora el agua se queda arriba, donde está la chacra.</p></blockquote>
    <h3>Lecciones para replicar</h3>
    <p>El factor decisivo no fue la obra sino el <strong>acuerdo de mantenimiento</strong>: las qochas sin faena anual se colmatan en tres años. Ver también el <a href="https://www.gob.pe/inaigem">portal de INAIGEM</a> sobre siembra y cosecha de agua.</p>
  video_url: null
  imagen_titulo: Qochas construidas por la comunidad de Pampallacta.
  palabras_clave:
  - Siembra de agua
  - Qochas
  - Pisac
  - Gestión comunal
  enlaces:
