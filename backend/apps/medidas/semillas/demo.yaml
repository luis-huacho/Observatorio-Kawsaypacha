    url: https://www.gob.pe/inaigem
  destacada: true
- slug: brigadas-incendios-calca
  titulo: Brigadas comunales contra incendios forestales en Calca
  peligro: incendios_forestales
  ambito: distrital
  resultado: exito
  distrito: 080301
  comunidad: Calca
  resumen_corto: Conformación de 8 brigadas comunales con equipamiento básico y protocolo de respuesta
    articulado al COER Cusco.
  contenido: |-
    <p>Tras los incendios de 2022, la municipalidad de Calca conformó <strong>ocho brigadas comunales</strong> con presupuesto del PPR 0068 y un protocolo de respuesta articulado con el COER Cusco.</p>
    <h2>Composición y equipamiento</h2>
    <p>Cada brigada reúne entre 10 y 15 personas de la comunidad, con equipamiento básico de ataque directo y comunicación por radio con el centro de operaciones distrital.</p>
    <ol>
    <li>Batefuegos, rastrillos forestales y mochilas de agua.</li>
    <li>Equipo de protección personal certificado.</li>
    <li>Radio VHF con frecuencia compartida con el COER.</li>
    </ol>
    <figure class="media"><oembed url="https://www.youtube.com/watch?v=aqz-KE-bpKQ"></oembed></figure>
    <h2>Resultado</h2>
    <p>En la temporada siguiente la superficie afectada se redujo un <strong>40%</strong>, con tiempos de primera respuesta que bajaron de horas a minutos en las zonas con brigada activa.</p>
    <h3>Condición crítica</h3>
    <p>La rotación de autoridades pone en riesgo la continuidad: el equipamiento se deteriora y la capacitación caduca si no hay presupuesto anual comprometido.</p>
  video_url: https://www.youtube.com/watch?v=aqz-KE-bpKQ
