- slug: viviendas-heladas-chahuaytiri
  titulo: Acondicionamiento térmico de viviendas en Chahuaytiri
  peligro: heladas
  ambito: comunal
  resultado: exito
  distrito: 080302
  comunidad: Chahuaytiri
  resumen_corto: Mejoramiento térmico de 80 viviendas con aislamiento de techos y muros trombe. Reducción
    de IRA en menores de 5 años.
  contenido: |-
    <p>Trabajo conjunto entre la comunidad, la posta de salud y FONCODES para el mejoramiento térmico de <strong>80 viviendas</strong> mediante aislamiento de techos y muros trombe.</p>
    <h2>La intervención</h2>
    <p>El muro trombe capta radiación solar durante el día y la libera dentro de la vivienda por la noche, cuando la temperatura exterior cae por debajo de cero en la temporada de heladas.</p>
    <ul>
    <li>Aislamiento de techos con material local.</li>
    <li>Muro trombe orientado al norte en el ambiente de dormir.</li>
    <li>Sellado de vanos y mejora de ventilación cruzada.</li>
    </ul>
    <h2>Indicador de salud</h2>
    <p>La posta registró una reducción del <strong>35% en consultas por infecciones respiratorias agudas en menores de cinco años</strong> durante la temporada de heladas siguiente a la intervención.</p>
    <blockquote><p>El dato de la posta fue lo que convenció al resto de familias. No el folleto.</p></blockquote>
  video_url: null
  imagen_titulo: Vivienda con acondicionamiento térmico en Chahuaytiri.
