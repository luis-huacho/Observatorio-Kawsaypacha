- slug: leccion-evar-quispicanchi
  titulo: 'EVAR distrital desactualizado: lección de Quispicanchi'
  peligro: movimientos_en_masa
  ambito: provincial
  resultado: leccion
  distrito: 080801
  comunidad: Quispicanchi
  resumen_corto: El EVAR del 2017 no incluyó nuevas zonas urbanizadas, dejando viviendas sin clasificación
    de riesgo durante movimientos en masa del 2024.
  contenido: |-
    <p>El Estudio de Evaluación de Riesgos del 2017 no incorporó las zonas urbanizadas después de esa fecha, dejando viviendas sin clasificación de riesgo durante los movimientos en masa de 2024.</p>
    <h2>El desfase</h2>
    <p>Entre 2017 y 2024 la mancha urbana creció sobre laderas que el estudio no había evaluado. Cuando ocurrió el evento, esas viviendas no figuraban en ningún registro de riesgo y quedaron fuera de la respuesta priorizada.</p>
    <h2>Recomendación</h2>
    <ul>
    <li>Actualización periódica del EVAR con cargo al PPR 0068.</li>
    <li>Articulación con el catastro municipal para detectar nueva ocupación.</li>
    <li>Revisión obligatoria tras cada evento de magnitud.</li>
    </ul>
    <p>Es el mismo vacío que el visor del observatorio muestra en gris: <a href="/peligros">centros poblados sin clasificación</a> que no son centros poblados sin riesgo.</p>
  video_url: null
