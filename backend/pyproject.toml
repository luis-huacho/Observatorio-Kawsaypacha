[project]
name = "observatorio-backend"
version = "0.1.0"
description = "Backend del Observatorio Kallpachakuy (PREDES) — Django 5.2 LTS"
requires-python = ">=3.12,<3.14"
dependencies = [
    "django~=5.2.0",
    "djangorestframework>=3.15",
    "django-filter>=24.3",
    "drf-spectacular>=0.28",
    "django-unfold>=0.42",
    "django-tasks>=0.12",
    "django-tasks-db>=0.12",
    "meilisearch>=0.33",
    "google-genai>=1.0",
    "openpyxl>=3.1",
    "weasyprint>=63",
    "gunicorn>=23",
    "psycopg[binary]>=3.2",
    "django-environ>=0.11",
    "whitenoise>=6.8",
    "pillow>=10.4",
]

[dependency-groups]
dev = [
    "django-debug-toolbar>=4.4",
]

[tool.uv]
package = false
